<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#FAF8F5" />

    <!-- SEO -->
    <title>TextileHub — Indian B2B Textile Sourcing & Weaves</title>
    <meta
      name="description"
      content="TextileHub: India's premier B2B marketplace for fabric buyers and mills in Surat, Ahmedabad, and Tirupur. Discover wholesale fabrics, request sample swatches, and place escrow-protected bulk orders."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="TextileHub — Indian B2B Textile Sourcing & Weaves" />
    <meta property="og:description" content="Connect garment buyers and verified weaving mills across India." />
    <meta property="og:type" content="website" />

    <!-- Favicon & Application Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg" />

    <!-- Fast Network Preconnects & DNS Prefetching for 3G/4G Speed -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Optimized Google Fonts with Swap strategy -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600..800;1,600..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React mounts here -->
    <div id="root"></div>

    <!-- Entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
