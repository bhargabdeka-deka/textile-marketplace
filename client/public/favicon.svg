<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Rounded black square background (Squircle) -->
  <rect width="512" height="512" rx="112" ry="112" fill="#09090B"/>
  
  <!-- Subtle border for high contrast on dark tab bars -->
  <rect x="4" y="4" width="504" height="504" rx="108" ry="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="8"/>
  
  <!-- Isometric Cube Contour (White) -->
  <path d="M 256 116 L 392 192 L 392 344 L 256 420 L 120 344 L 120 192 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center Vertical Seam (White) -->
  <path d="M 256 268 L 256 420" 
        fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left Top Seam (White) -->
  <path d="M 256 268 L 120 192" 
        fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Top Seam (Signature Premium Blue Accent #0070F3) -->
  <path d="M 256 268 L 392 192" 
        fill="none" stroke="#0070F3" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Brand Accent Dot at Top-Right Vertex -->
  <circle cx="392" cy="192" r="16" fill="#0070F3"/>
</svg>