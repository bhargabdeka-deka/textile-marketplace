<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Rounded Linen Cream Background Squircle -->
  <rect width="512" height="512" rx="112" ry="112" fill="#FAF8F5"/>
  
  <!-- Subtle Olive Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" ry="104" fill="none" stroke="#7B8B30" stroke-opacity="0.3" stroke-width="12"/>
  
  <!-- Outer Loom Frame -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="none" stroke="#7B8B30" stroke-width="28" stroke-dasharray="48 24"/>
  
  <!-- Vertical Warp Threads -->
  <path d="M 160 80 L 160 432" stroke="#7B8B30" stroke-width="24" stroke-linecap="round"/>
  <path d="M 256 80 L 256 432" stroke="#7B8B30" stroke-width="24" stroke-linecap="round"/>
  <path d="M 352 80 L 352 432" stroke="#7B8B30" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Horizontal Weft Threads -->
  <path d="M 80 160 L 432 160" stroke="#7B8B30" stroke-width="24" stroke-linecap="round"/>
  <path d="M 80 256 L 432 256" stroke="#7B8B30" stroke-width="24" stroke-linecap="round"/>
  <path d="M 80 352 L 432 352" stroke="#7B8B30" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Central Woven Emblem Square Badge with 'T' -->
  <rect x="192" y="192" width="128" height="128" rx="28" fill="#7B8B30"/>
  <path d="M 224 232 H 288 M 256 232 V 288" stroke="#FAF8F5" stroke-width="20" stroke-linecap="round"/>
</svg>